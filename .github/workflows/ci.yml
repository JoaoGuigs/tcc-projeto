name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: tcc-projeto_test
          MYSQL_ROOT_PASSWORD: ci_change_me
        ports:
          - 3310:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint --workspace server
      - run: npm run test --workspace server
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3310
          DB_USER: root
          DB_PASSWORD: ci_change_me
          DB_NAME: tcc-projeto_test
          JWT_SECRET: ci-secret-with-at-least-32-characters-long

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test --workspace client
      - run: npm run typecheck --workspace client
      - run: npm run lint --workspace client
      - run: npm run build --workspace client

  ai-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r ai-service/requirements.txt
      - run: python -m pytest ai-service -q
