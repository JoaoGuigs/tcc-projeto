services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: tcc-projeto
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-local_change_me}
      MYSQL_PWD: ${DB_PASSWORD:-local_change_me}
      TZ: America/Sao_Paulo
    ports:
      - "3310:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    networks: [app]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  ai:
    build: ./ai-service
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      AI_SERVICE_KEY: ${AI_SERVICE_KEY:-}
      TZ: America/Sao_Paulo
    restart: unless-stopped
    networks: [app]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      NODE_ENV: production
      TZ: America/Sao_Paulo
      PORT: 3001
      CLIENT_ORIGIN: http://localhost:3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-local_change_me}
      DB_NAME: tcc-projeto
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-with-at-least-32-characters}
      COOKIE_SECURE: "false"
      AI_SERVICE_URL: http://ai:8000
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-meta}
      WHATSAPP_PROFESSIONAL_ID: ${WHATSAPP_PROFESSIONAL_ID:-1}
      META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-v23.0}
      META_WHATSAPP_TOKEN: ${META_WHATSAPP_TOKEN:-}
      META_PHONE_NUMBER_ID: ${META_PHONE_NUMBER_ID:-}
      META_WABA_ID: ${META_WABA_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN:-}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-http://host.docker.internal:8080}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-local-webhook-secret-change-me}
      NUMERO_AUTORIZADO: ${NUMERO_AUTORIZADO:-}
      AI_SERVICE_KEY: ${AI_SERVICE_KEY:-}
    command: ["sh", "-c", "npm run db:migrate --workspace server && node server/index.js"]
    restart: unless-stopped
    networks: [app]
    depends_on:
      mysql:
        condition: service_healthy
      ai:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "3000:80"
    restart: unless-stopped
    networks: [app]
    depends_on:
      api:
        condition: service_started

volumes:
  mysql_data:

networks:
  app:
